<style>
:root{--green:#0B6623;--green-dark:#074718;--green-soft:#E3F1E7;--orange:#147A31;--beige-soft:#FCEEE2;--beige-text:#B85D0E;--bg:#F4F7F4;--bgDesk:#E5ECE5;--surface:#fff;--surface-soft:#EEF4EE;--text:#142018;--muted:#5A695F;--border:#DCE5DE;--danger:#C92A2A;--shadow:0 2px 10px rgba(11,102,35,.06)}
html[data-theme="sand"]{--green:#1B6B3A;--green-dark:#124C28;--green-soft:#E5F2EA;--orange:#E67A15;--beige-soft:#FCEADB;--beige-text:#B8580A;--bg:#F7F4EE;--bgDesk:#EAE5DA;--surface:#FFFDF9;--surface-soft:#F3EFE6;--text:#211D17;--muted:#6A6156;--border:#E5DEC9}
html[data-theme="dark"]{--green:#229A52;--green-dark:#17723B;--green-soft:#163623;--orange:#F38218;--beige-soft:#382616;--beige-text:#F69D42;--bg:#0F1713;--bgDesk:#080D0B;--surface:#18231D;--surface-soft:#1F2D25;--text:#EEF3F0;--muted:#9AA89F;--border:#28382F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bgDesk);color:var(--text);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08)}
header{background:var(--green);color:#fff;padding:16px 16px 18px;position:sticky;top:0;z-index:25}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.logo{display:flex;gap:10px;align-items:center}
.badge-logo{width:38px;height:38px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);font-size:14px}
.brand b{font-size:19px;text-transform:uppercase;line-height:1}
.brand small{font-size:11px;opacity:.9}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
.search{position:relative}
.search input{width:100%;background:var(--surface);border:0;border-radius:999px;padding:12px 40px 12px 42px;font-size:14px;color:var(--text);outline:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.search span{position:absolute;left:15px;top:50%;transform:translateY(-50%)}
#clearBtn{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:var(--surface-soft);border:1px solid var(--border);width:24px;height:24px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;font-weight:800}
.content{flex:1;padding:15px 15px 100px}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.label button{background:var(--surface);border:1px solid var(--border);padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;color:var(--text)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}
.step{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:inherit;color:var(--text)}
.step.active{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.step b{font-size:12.5px}.step span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--surface-soft);color:var(--muted)}
.step.active span{background:var(--green);color:#fff}
.zones{display:flex;gap:6px;overflow-x:auto;margin-bottom:15px;padding-bottom:3px;scrollbar-width:none}
.zones::-webkit-scrollbar{display:none}
.zone{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap}
.zone.active{background:var(--green-soft);color:var(--green);font-weight:700;border-color:var(--green)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec b{font-size:14px}.sec span{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:3px 10px;border-radius:999px}
