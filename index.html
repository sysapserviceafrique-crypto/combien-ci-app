<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMBIEN CI</title>
<style>
body{margin:0;font-family:sans-serif;background:#F2F5F2}
.hd{background:#0B6B3A;color:#fff;padding:18px;border-radius:0 0 28px 28px}
.logo{font-size:30px;font-weight:900}
.logo span{color:#F38218}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top button{border:0;padding:10px 14px;border-radius:20px;font-weight:800}
.b1{background:#2E8B57;color:#fff}
.b2{background:#F38218;color:#000}
input{width:100%;padding:14px;border:0;border-radius:30px;margin-top:14px;font-size:15px;box-sizing:border-box}
.cats{display:flex;gap:8px;padding:12px;overflow-x:auto}
.cats button{white-space:nowrap;border:0;background:#fff;padding:9px 16px;border-radius:20px;font-weight:700}
.cats button.on{background:#111;color:#fff}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden}
.card-top{height:90px;color:#fff;font-weight:900;padding:10px;display:flex;align-items:flex-end}
.card-body{padding:10px}
.price{color:#0B6B3A;font-weight:900;font-size:17px}
.vip{margin:12px;background:#FFF7ED;border:2px dashed #F38218;border-radius:14px;padding:14px}
.vip a{display:block;background:#1A8CFF;color:#fff;text-align:center;padding:13px;border-radius:10px;text-decoration:none;font-weight:900;margin-top:10px}
#popup{position:fixed;left:12px;right:12px;bottom:20px;background:#fff;border:2px solid #0B6B3A;border-radius:16px;padding:16px;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>

<div class="hd">
  <div class="top">
    <div class="logo">COMBIEN <span>CI</span><div style="font-size:13px;font-weight:400">Les prix fixes en Côte d'Ivoire</div></div>
    <div>
      <button class="b1" onclick="assistant()">Assistant</button>
      <button class="b2" onclick="parametres()">Paramètres</button>
    </div>
  </div>
  <input id="rech" placeholder="Rechercher un produit" onkeyup="recherche()">
</div>

<div class="cats">
  <button id="btn-tout" class="on" onclick="filtre('tout')">Tous</button>
  <button id="btn-alim" onclick="filtre('alim')">Alimentation</button>
  <button id="btn-mach" onclick="filtre('mach')">Machines</button>
  <button id="btn-mat" onclick="filtre('mat')">Matériaux</button>
  <button id="btn-cacao" onclick="filtre('cacao')">Cacao</button>
  <button id="btn-hotel" onclick="filtre('hotel')">Hôtels</button>
</div>

<div id="liste" class="list"></div>

<div class="vip">
  <b>⭐ VIP COMBIEN CI - 500 FCFA</b><br>
  <small>Baisses de prix + offres + conseils</small>
  <a href="https://pay.wave.com/m/M_ci_gP0r8bDWtwdh/c/ci/?amount=500">PAYER 500F AVEC WAVE 💙</a>
</div>

<div id="popup"></div>

<script>
// --- LES PRODUITS ---
var produits = [
  {cat:"alim", titre:"RIZ 22,5 KG", nom:"Riz 5% brisures", lieu:"Abidjan", prix:"12 788 FCFA", couleur:"#0B6B3A", info:"Prix fixe. Si plus cher, appelle 1343."},
  {cat:"alim", titre:"HUILE 1,5 L", nom:"Huile de table", lieu:"Abidjan", prix:"1 775 FCFA", couleur:"#E67E22", info:"Prix fixe officiel."},
  {cat:"alim", titre:"GAZ 6 KG", nom:"Gaz butane", lieu:"National", prix:"2 000 FCFA", couleur:"#1E3A2F", info:"Prix fixe national."},
  {cat:"alim", titre:"GAZ 12,5 KG", nom:"Gaz butane", lieu:"National", prix:"6 965 FCFA", couleur:"#0B6B3A", info:"Prix fixe national."},
  {cat:"cacao", titre:"CACAO 1 KG", nom:"Cacao bord champ", lieu:"National", prix:"2 800 FCFA", couleur:"#1E3A2F", info:"Ne vends pas en dessous de 2800F."},
  {cat:"mat", titre:"CIMENT 50 KG", nom:"Ciment CPJ 45", lieu:"Abidjan", prix:"4 500 FCFA", couleur:"#0E7A7A", info:"Sac 50kg."},
  {cat:"mat", titre:"PARPAING 15", nom:"Parpaing creux", lieu:"Abidjan", prix:"350 FCFA", couleur:"#0B6B3A", info:"Prix à l'unité."},
  {cat:"mach", titre:"POMPE EAU", nom:"Pompe électrique", lieu:"Adjamé", prix:"45 000 FCFA", couleur:"#1E3A2F", info:"Pompe 1HP."},
  {cat:"hotel", titre:"HOTEL PLATEAU", nom:"Chambre standard", lieu:"Le Plateau", prix:"25 000 FCFA / nuit", couleur:"#0B6B3A", info:"Clim, WiFi."},
  {cat:"hotel", titre:"HOTEL ASSINIE", nom:"Bord de mer", lieu:"Assinie", prix:"45 000 FCFA / nuit", couleur:"#E67E22", info:"Vue lagune."}
];

var catActuelle = "tout";

function afficher(){
  var q = document.getElementById("rech").value.toLowerCase();
  var html = "";
  for(var i=0;i<produits.length;i++){
    var p = produits[i];
    if(catActuelle != "tout" && p.cat != catActuelle) continue;
    if(q != "" && p.titre.toLowerCase().indexOf(q)==-1 && p.nom.toLowerCase().indexOf(q)==-1) continue;
    html += '<div class="card" onclick="detail('+i+')"><div class="card-top" style="background:'+p.couleur+'">'+p.titre+'</div><div class="card-body"><b>'+p.nom+'</b><br><small>'+p.lieu+'</small><div class="price">'+p.prix+'</div></div></div>';
  }
  if(html=="") html = "<p>Aucun produit trouvé</p>";
  document.getElementById("liste").innerHTML = html;
}

function filtre(c){
  catActuelle = c;
  var boutons = document.querySelectorAll(".cats button");
  for(var i=0;i<boutons.length;i++) boutons[i].classList.remove("on");
  if(c=="tout") document.getElementById("btn-tout").classList.add("on");
  if(c=="alim") document.getElementById("btn-alim").classList.add("on");
  if(c=="mach") document.getElementById("btn-mach").classList.add("on");
  if(c=="mat") document.getElementById("btn-mat").classList.add("on");
  if(c=="cacao") document.getElementById("btn-cacao").classList.add("on");
  if(c=="hotel") document.getElementById("btn-hotel").classList.add("on");
  afficher();
}

function recherche(){ afficher(); }

function detail(i){
  var p = produits[i];
  document.getElementById("popup").style.display = "block";
  document.getElementById("popup").innerHTML = "<b>"+p.titre+"</b><p>"+p.nom+" - "+p.lieu+"</p><b style='color:#0B6B3A;font-size:20px'>"+p.prix+"</b><p>"+p.info+"</p><button onclick='fermer()' style='width:100%;padding:12px;border:0;border-radius:10px;background:#eee;font-weight:800'>Fermer</button>";
}

function fermer(){ document.getElementById("popup").style.display = "none"; }

function parametres(){
  document.getElementById("popup").style.display = "block";
  document.getElementById("popup").innerHTML = "<b>Paramètres</b><p>Créateur : M. SILEYMANE SY<br>Prix abusifs : 1343<br>Pompiers : 180<br>Email : sysapserviceafrique@gmail.com</p><button onclick='fermer()' style='width:100%;padding:12px;border:0;border-radius:10px;background:#eee;font-weight:800'>Fermer</button>";
}

function assistant(){
  var q = prompt("Assistant COMBIEN CI - Que veux-tu savoir ? Ex: prix du riz, cacao, ciment");
  if(!q) return;
  q = q.toLowerCase();
  var reponse = "Prix fixes : Riz 22,5kg = 12 788F, Gaz 6kg = 2 000F, Cacao = 2 800F/kg. Si on te vend plus cher, appelle le 1343.";
  if(q.indexOf("riz")!=-1) reponse = "Riz 22,5kg = 12 788 FCFA à Abidjan. C'est le prix fixe.";
  if(q.indexOf("cacao")!=-1) reponse = "Cacao bord champ = 2 800 FCFA / kg. Ne vends pas en dessous.";
  if(q.indexOf("ciment")!=-1) reponse = "Ciment 50kg = 4 500 FCFA à Abidjan.";
  if(q.indexOf("gaz")!=-1) reponse = "Gaz 6kg = 2 000F, Gaz 12,5kg = 6 965F. Prix fixe national.";
  if(q.indexOf("hotel")!=-1) reponse = "Hôtel Plateau 25 000F/nuit, Assinie 45 000F/nuit, Bouaké 18 000F/nuit.";
  alert(reponse);
}

afficher();
</script>
</body>
</html>
