<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMBIEN CI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F5F7F6;color:#14201A;padding-bottom:84px}
.hd{background:#0B6B3A;color:#fff;padding:18px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.br{font-size:24px;font-weight:800}
.br b{color:#F38218}
.sb{font-size:12px;opacity:.92;margin-top:3px}
.act{display:flex;gap:6px}
.btn-top{border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.btn-ai{background:rgba(255,255,255,.2);color:#fff}
.btn-st{background:#F38218;color:#14201A}
.sr{margin-top:12px;background:#fff;border-radius:999px;padding:0 14px;height:44px;display:flex;align-items:center}
.sr input{width:100%;border:0;outline:0;font-size:14px;background:transparent;color:#14201A}
.ch{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
.pill{border:1px solid #E3E8E5;background:#fff;color:#14201A;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.pill.on{background:#14201A;color:#fff;border-color:#14201A}
.sh{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:15px;font-weight:800}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.cd{position:relative;background:#fff;border:1px solid #E3E8E5;border-radius:14px;overflow:hidden;cursor:pointer}
.ph{height:84px;display:flex;align-items:flex-end;padding:9px;color:#fff;font-weight:800;font-size:13px}
.cb{padding:10px}
.nm{font-size:13px;font-weight:700}
.zn{font-size:11px;color:#5D6A62;margin-top:2px}
.pr{font-size:15px;font-weight:800;color:#0B6B3A;margin-top:6px}
.tg{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:#E5F3EA;color:#0B6B3A}
.tg.vip{background:#FCEEE2;color:#B35A0C}
.fav{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-weight:800;cursor:pointer}
.box{margin:14px;background:#fff;border:1px solid #E3E8E5;border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid #E3E8E5;font-size:13.5px;font-weight:700;cursor:pointer}
.row:last-child{border-bottom:0}
.val{font-size:12px;color:#5D6A62;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E3E8E5;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0 12px}
.ni{border:0;background:none;font-size:12px;font-weight:700;color:#5D6A62;cursor:pointer}
.ni.on{color:#0B6B3A}
.modal{display:none;position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;align-items:flex-end}
.modal.open{display:flex}
.mcard{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mbtn{width:100%;border:0;border-radius:10px;padding:11px;margin-top:8px;font-size:13.5px;font-weight:700;background:#0B6B3A;color:#fff;cursor:pointer}
.mbtn.or{background:#F38218;color:#14201A}
.mbtn.gr{background:#E4E8E5;color:#14201A}
.mnote{margin-top:10px;padding:10px;border-radius:10px;background:#E5F3EA;color:#062F1B;font-size:12.5px}
.mfield{width:100%;padding:10px;border:1px solid #E3E8E5;border-radius:10px;margin-top:8px;font-size:14px}
</style>
</head>
<body>

<header class="hd" id="topHd">
  <div class="top">
    <div>
      <div class="br">COMBIEN <b>CI</b></div>
      <div class="sb">Les prix fixes en Côte d'Ivoire</div>
    </div>
    <div class="act">
      <button type="button" class="btn-top btn-ai" onclick="openBox('ai')">Assistant</button>
      <button type="button" class="btn-top btn-st" onclick="setTab('settings')">Paramètres</button>
    </div>
  </div>
  <div class="sr">
    <input id="q" type="search" placeholder="Rechercher un produit" oninput="draw()">
  </div>
</header>

<div id="main"></div>

<nav class="nav">
  <button type="button" class="ni on" id="n-home" onclick="setTab('home')">Accueil</button>
  <button type="button" class="ni" id="n-search" onclick="goSearch()">Recherche</button>
  <button type="button" class="ni" id="n-favs" onclick="setTab('favs')">Favoris</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeBox()">
  <div class="mcard" id="mcard"></div>
</div>

<script>
var ITEMS = [
  {id:1, ph:"RIZ 22,5 KG", bg:"#0B6B3A", name:"Riz, 5 % de brisures", zone:"Abidjan et 30 km", price:12788, cat:"Alimentation", vip:false},
  {id:2, ph:"HUILE 1,5 L", bg:"#D97706", name:"Huile de table", zone:"Abidjan et 30 km", price:1775, cat:"Alimentation", vip:false},
  {id:3, ph:"SUCRE 1 KG", bg:"#0F766E", name:"Sucre blanc granulé", zone:"Abidjan et 30 km", price:875, cat:"Alimentation", vip:false},
  {id:4, ph:"PAIN 232 G", bg:"#B45309", name:"Baguette de pain", zone:"Abidjan et 30 km", price:200, cat:"Alimentation", vip:false},
  {id:5, ph:"POMPE EAU", bg:"#065F46", name:"Motopompe thermique", zone:"Abidjan", price:145000, cat:"Machines", vip:true},
  {id:6, ph:"CIMENT 50 KG", bg:"#334155", name:"Sac de ciment CPA 42,5", zone:"Abidjan", price:4600, cat:"Matériaux", vip:false}
];

var CATS = ["Tous", "Alimentation", "Machines", "Matériaux"];
var tab = "home";
var cat = "Tous";
var favs = [];
var vipUntil = 0;
var hdColor = "#0B6B3A";
var lang = "Français";
var zonePref = "Abidjan";

function money(n){
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";
}

function isVip(){
  return Date.now() < vipUntil;
}

function setTab(t){
  tab = t;
  document.getElementById("n-home").className = "ni" + (t==="home" ? " on" : "");
  document.getElementById("n-favs").className = "ni" + (t==="favs" ? " on" : "");
  document.getElementById("n-search").className = "ni";
  draw();
}

function goSearch(){
  if(tab==="settings") setTab("home");
  document.getElementById("n-home").className = "ni";
  document.getElementById("n-favs").className = "ni";
  document.getElementById("n-search").className = "ni on";
  var el = document.getElementById("q");
  if(el) el.focus();
}

function pickCat(c){
  cat = c;
  draw();
}

function toggleFav(id, ev){
  if(ev) ev.stopPropagation();
  var idx = favs.indexOf(id);
  if(idx >= 0) favs.splice(idx, 1);
  else favs.push(id);
  draw();
}

function draw(){
  document.getElementById("topHd").style.background = hdColor;
  var main = document.getElementById("main");
  if(!main) return;

  if(tab === "settings"){
    main.innerHTML =
      '<div class="sh">Paramètres<span>CI</span></div>'
      + '<div class="box">'
        + '<div class="row" onclick="cycleLang()"><span>Langue</span><span class="val">' + lang + '</span></div>'
        + '<div class="row" onclick="cycleZone()"><span>Zone par défaut</span><span class="val">' + zonePref + '</span></div>'
        + '<div class="row" onclick="openBox(\'bg\')"><span>Photo / Couleur de fond</span><span class="val">Changer</span></div>'
        + '<div class="row" onclick="setTab(\'favs\')"><span>Mes favoris</span><span class="val">' + favs.length + '</span></div>'
        + '<div class="row" onclick="openBox(\'vip\')"><span>Abonnement VIP</span><span class="val">' + (isVip() ? "ACTIF" : "500F / 2M") + '</span></div>'
        + '<div class="row" onclick="openBox(\'num\')"><span>Numéros utiles (1343)</span><span class="val">Voir</span></div>'
        + '<div class="row" onclick="openBox(\'about\')"><span>À propos & Créateur</span><span class="val">Voir</span></div>'
      + '</div>';
    return;
  }

  var qEl = document.getElementById("q");
  var q = qEl && qEl.value ? qEl.value.toLowerCase().replace(/^\s+|\s+$/g, "") : "";

  var list = [];
  for(var i=0; i<ITEMS.length; i++){
    var it = ITEMS[i];
    var okC = (cat === "Tous" || it.cat === cat);
    var okF = (tab !== "favs" || favs.indexOf(it.id) >= 0);
    var okQ = (!q || it.name.toLowerCase().indexOf(q) >= 0 || it.zone.toLowerCase().indexOf(q) >= 0 || it.cat.toLowerCase().indexOf(q) >= 0);
    if(okC && okF && okQ) list.push(it);
  }

  var pills = "";
  for(var j=0; j<CATS.length; j++){
    var c = CATS[j];
    pills += '<button type="button" class="pill' + (cat===c ? " on" : "") + '" onclick="pickCat(\'' + c + '\')">' + c + '</button>';
  }

  var cards = "";
  for(var k=0; k<list.length; k++){
    var p = list[k];
    var isF = favs.indexOf(p.id) >= 0;
    var lock = p.vip && !isVip();
    cards +=
      '<div class="cd" onclick="openProd(' + p.id + ')">'
        + '<button type="button" class="fav" onclick="toggleFav(' + p.id + ', event)">' + (isF ? "★" : "☆") + '</button>'
        + '<div class="ph" style="background:' + p.bg + '">' + p.ph + '</div>'
        + '<div class="cb">'
          + '<div class="nm">' + p.name + '</div>'
          + '<div class="zn">' + p.zone + '</div>'
          + '<div class="pr">' + (lock ? "VIP requis" : money(p.price)) + '</div>'
          + '<span class="tg' + (lock ? " vip" : "") + '">' + (lock ? "VIP 500F / 2 mois" : "Prix fixe") + '</span>'
        + '</div>'
      + '</div>';
  }

  if(!cards){
    cards = '<div style="grid-column:1/-1;background:#fff;padding:18px;border-radius:12px;text-align:center;color:#5D6A62">Aucun produit trouvé.</div>';
  }

  main.innerHTML =
    '<div class="ch">' + pills + '</div>'
    + '<div class="sh">' + (tab==="favs" ? "Mes favoris" : "Prix fixes CI") + '<span>' + list.length + '</span></div>'
    + '<div class="gr">' + cards + '</div>';
}

function cycleLang(){
  var arr = ["Français", "Dioula", "Baoulé"];
  lang = arr[(arr.indexOf(lang)+1)%arr.length];
  draw();
}

function cycleZone(){
  var arr = ["Abidjan", "Yamoussoukro", "Bouaké"];
  zonePref = arr[(arr.indexOf(zonePref)+1)%arr.length];
  draw();
}

function openProd(id){
  var p = null;
  for(var i=0; i<ITEMS.length; i++){
    if(ITEMS[i].id === id) p = ITEMS[i];
  }
  if(!p) return;
  if(p.vip && !isVip()){
    openBox("vip");
    return;
  }
  showModal(
    '<div class="mhead"><b>' + p.name + '</b><button type="button" onclick="closeBox()">X</button></div>'
    + '<div class="mnote">Prix repère : <b>' + money(p.price) + '</b><br>Zone : ' + p.zone + '<br>Catégorie : ' + p.cat + '</div>'
    + '<button type="button" class="mbtn gr" onclick="closeBox()">Fermer</button>'
  );
}

function openBox(kind){
  if(kind === "ai"){
    showModal(
      '<div class="mhead"><b>Petit Assistant COMBIEN CI</b><button type="button" onclick="closeBox()">X</button></div>'
      + '<div style="font-size:12.5px;color:#5D6A62">Tape un produit (riz, huile, sucre, pain, ciment).</div>'
      + '<input id="aiInp" class="mfield" placeholder="Ex : riz">'
      + '<button type="button" class="mbtn" onclick="findAi()">Chercher le prix</button>'
      + '<div id="aiRes" class="mnote">Prêt.</div>'
    );
  } else if(kind === "bg"){
    showModal(
      '<div class="mhead"><b>Fond de l\'en-tête</b><button type="button" onclick="closeBox()">X</button></div>'
      + '<button type="button" class="mbtn" onclick="hdColor=\'#0B6B3A\';draw();closeBox()">Vert Côte d\'Ivoire</button>'
      + '<button type="button" class="mbtn" style="background:#062F1B" onclick="hdColor=\'#062F1B\';draw();closeBox()">Vert foncé Studio</button>'
      + '<button type="button" class="mbtn or" onclick="hdColor=\'#B35A0C\';draw();closeBox()">Orange Marché CI</button>'
      + '<button type="button" class="mbtn gr" onclick="closeBox()">Fermer</button>'
    );
  } else if(kind === "vip"){
    showModal(
      '<div class="mhead"><b>COMBIEN CI VIP</b><button type="button" onclick="closeBox()">X</button></div>'
      + '<div class="mnote">' + (isVip() ? "VIP actif." : "Accès VIP : 500 FCFA pour 2 mois.") + '</div>'
      + '<button type="button" class="mbtn or" onclick="vipUntil=Date.now()+(60*86400000);draw();openBox(\'vip\')">Activer VIP 2 mois (500F)</button>'
      + '<button type="button" class="mbtn gr" onclick="closeBox()">Fermer</button>'
    );
  } else if(kind === "num"){
    showModal(
      '<div class="mhead"><b>Numéros utiles</b><button type="button" onclick="closeBox()">X</button></div>'
      + '<div class="mnote">Prix abusifs : <b>1343</b><br>Pompiers : <b>180</b><br>Protection civile : <b>150</b></div>'
      + '<button type="button" class="mbtn gr" onclick="closeBox()">Fermer</button>'
    );
  } else if(kind === "about"){
    showModal(
      '<div class="mhead"><b>À propos & Créateur</b><button type="button" onclick="closeBox()">X</button></div>'
      + '<div class="mnote">Application : <b>COMBIEN CI</b><br>Créateur : <b>M. SILEYMANE SY</b><br>E-mail : <b>sysapserviceafrique@gmail.com</b></div>'
      + '<button type="button" class="mbtn gr" onclick="closeBox()">Fermer</button>'
    );
  }
}

function findAi(){
  var el = document.getElementById("aiInp");
  var q = el && el.value ? el.value.toLowerCase().replace(/^\s+|\s+$/g, "") : "";
  var out = document.getElementById("aiRes");
  if(!out) return;
  if(!q){ out.textContent = "Tape un produit (riz, huile, sucre, pain, ciment)."; return; }
  for(var i=0; i<ITEMS.length; i++){
    var it = ITEMS[i];
    if(it.name.toLowerCase().indexOf(q) >= 0 || it.cat.toLowerCase().indexOf(q) >= 0){
      out.innerHTML = '<b>' + it.name + '</b> (' + it.zone + ') : <b>' + (it.vip && !isVip() ? "Réservé VIP" : money(it.price)) + '</b>';
      return;
    }
  }
  out.textContent = "Aucun produit trouvé pour « " + q + " ».";
}

function showModal(h){
  document.getElementById("mcard").innerHTML = h;
  document.getElementById("modal").className = "modal open";
}

function closeBox(){
  document.getElementById("modal").className = "modal";
}

draw();
</script>
</body>
</html>
