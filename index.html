<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMBIEN CI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0B6B3A;
  --brand-dark:#062F1B;
  --brand-light:#16A365;
  --brand-soft:#E5F3EA;
  --accent:#F38218;
  --accent-soft:#FCEEE2;
  --accent-text:#B35A0C;
  --bg:#F5F7F6;
  --card:#FFFFFF;
  --text:#14201A;
  --muted:#5D6A62;
  --border:#E3E8E5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',Arial,sans-serif;
  background:#E5EAE7;
  color:var(--text);
  display:flex;
  justify-content:center;
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

.app{
  position:relative;
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:86px;
  box-shadow:0 14px 42px rgba(0,0,0,.1);
}

/* En-tete avec visuel d'arriere-plan pro */
.hd{
  position:relative;
  padding:20px 18px 22px;
  color:#fff;
  border-radius:0 0 28px 28px;
  overflow:hidden;
  background:linear-gradient(155deg,#062F1B 0%,#0B6B3A 60%,#128A54 100%);
}
.hd-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.34;
  pointer-events:none;
}
.hd-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 86% 18%,rgba(243,130,24,.36),transparent 42%),
    linear-gradient(165deg,rgba(6,47,27,.82) 0%,rgba(11,107,58,.72) 55%,rgba(6,47,27,.88) 100%);
  pointer-events:none;
}
.hd-content{position:relative;z-index:2}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.br{font-size:25px;font-weight:800;letter-spacing:.3px;line-height:1.1}
.br b{color:var(--accent)}
.sb{font-size:12.5px;opacity:.92;margin-top:4px}

/* Zone droite en haut : petit outil assistant + bouton Parametres */
.act{display:flex;gap:7px;align-items:center;flex-shrink:0}
.ai-mini{
  height:36px;
  padding:0 11px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(6px);
  color:#fff;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}
.ai-mini svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

.settings-pill{
  height:36px;
  padding:0 12px;
  border-radius:999px;
  border:0;
  background:var(--accent);
  color:#14201A;
  font-size:12px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}
.settings-pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.bg-change-row{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:11.5px;
  color:rgba(255,255,255,.88);
}
.bg-btn{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:11px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
}

.sr{
  margin-top:14px;
  background:#fff;
  border-radius:999px;
  height:46px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  color:var(--muted);
  font-size:13.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}
.sr svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}
.sr input{
  flex:1;min-width:0;border:0;background:transparent;color:var(--text);
  font-size:14px;outline:none
}

/* Categories */
.ch{display:flex;gap:8px;padding:15px 16px 4px;overflow-x:auto;scrollbar-width:none}
.ch::-webkit-scrollbar{display:none}
