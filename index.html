<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMBIEN CI</title>
<style>
body{margin:0;font-family:sans-serif;background:#F4F7F5;color:#14201A}
.hd{background:#0B6B3A;color:#fff;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{border:0;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer}
.or{background:#F38218;color:#14201A}
.grn{background:#157A47;color:#fff}
.box{margin:12px;padding:12px;background:#fff;border:2px solid #0B6B3A;border-radius:10px;display:none}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border:1px solid #CFD8D3;border-radius:10px;padding:10px;cursor:pointer}
.price{color:#0B6B3A;font-weight:800;margin-top:4px}
</style>
<script>
function voir(titre, texte){
  var b = document.getElementById("box");
  b.style.display = "block";
  b.innerHTML = "<b>" + titre + "</b><p style='margin:8px 0'>" + texte + "</p><button class='or' onclick='cacher()'>Fermer</button>";
}
function cacher(){
  document.getElementById("box").style.display = "none";
}
</script>
</head>
<body>

<div class="hd">
  <div class="top">
    <div><b>COMBIEN CI</b></div>
    <div>
      <button class="grn" onclick="voir('Assistant','Prix officiels : Riz 22,5 kg = 12 788 F, Huile 1,5 L = 1 775 F, Sucre 1 kg = 875 F, Pain = 200 F, Gaz 6 kg = 2 000 F, Gaz 12,5 kg = 6 965 F.')">Assistant</button>
      <button class="or" onclick="voir('Parametres','Prix abusifs : 1343 · Pompiers : 180 · Createur : M. SILEYMANE SY · sysapserviceafrique@gmail.com')">Parametres</button>
    </div>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="or" onclick="voir('Scanner','Codes reperes : 613001001 (Riz 22,5 kg), 613002001 (Gaz 6 kg), 613003005 (Pneu Toyota), 613004001 (Ampoule Bonnet Rouge).')">Scanner</button>
    <button class="or" onclick="voir('VIP 500 FCFA','Notifications prix & sensibilisation conso via Wave Business. Code reference : CI-500918.')">VIP 500F</button>
  </div>
</div>

<div id="box" class="box"></div>

<div class="list">
  <div class="card" onclick="voir('Riz 22,5 kg','Prix officiel : 12 788 FCFA · Abidjan et 30 km')">
    <div><b>Riz 22,5 kg</b></div>
    <div class="price">12 788 FCFA</div>
  </div>
  <div class="card" onclick="voir('Gaz butane 6 kg','Prix officiel : 2 000 FCFA · Abidjan et national')">
    <div><b>Gaz butane 6 kg</b></div>
    <div class="price">2 000 FCFA</div>
  </div>
  <div class="card" onclick="voir('Gaz butane 12,5 kg','Prix officiel : 6 965 FCFA · Abidjan et national')">
    <div><b>Gaz butane 12,5 kg</b></div>
    <div class="price">6 965 FCFA</div>
  </div>
  <div class="card" onclick="voir('Huile 1,5 L','Prix officiel : 1 775 FCFA · Abidjan et 30 km')">
    <div><b>Huile 1,5 L</b></div>
    <div class="price">1 775 FCFA</div>
  </div>
  <div class="card" onclick="voir('Pneu voiture Toyota','Prix indicatif : 38 000 FCFA · Abidjan')">
    <div><b>Pneu Toyota</b></div>
    <div class="price">38 000 FCFA</div>
  </div>
  <div class="card" onclick="voir('Ampoule Bonnet Rouge','Prix indicatif : 650 FCFA · Abidjan')">
    <div><b>Ampoule Bonnet Rouge</b></div>
    <div class="price">650 FCFA</div>
  </div>
</div>

</body>
</html>
