<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#F2F5F2;color:#14201A;padding-bottom:90px}
.hd{background:#0B6B3A;color:#fff;padding:18px 16px 22px;border-radius:0 0 28px 28px;position:relative;z-index:5}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logo{font-weight:900;font-size:30px;line-height:1;letter-spacing:-0.5px}

.btns{display:flex;gap:8px;flex-shrink:0}
.btns button{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;font-size:14px}
.btn-ass{background:#2E8B57;color:#fff}
.btn-par{background:#F38218;color:#000}
.search{margin-top:16px}

.cats button.active{background:#111;color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.sec b{font-size:17px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 14px}
.card{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative}
.card-top{height:105px;padding:12px;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:flex-end;position:relative}
.card-top.green{background:#0B6B3A}
.card-top.orange{background:#E67E22}
.card-top.teal{background:#0E7A7A}
.card-top.dark{background:#1E3A2F}
.fav{position:absolute;top:8px;right:8px;background:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#111;border:0;cursor:pointer;z-index:2}
.card-body{padding:10px 12px 12px}
.card-body b{font-size:14px;display:block}
.card-body small{color:#777;font-size:12px}
.price{color:#0B6B3A;font-weight:900;font-size:17px;margin-top:6px}
.badge{display:inline-block;background:#E8F5E9;color:#0B6B3A;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:800;margin-top:6px}
.vip{margin:14px;background:#FFF7ED;border:2px dashed #F38218;border-radius:16px;padding:14px}
.vip a{display:block;text-align:center;background:#1A8CFF;color:#fff;text-decoration:none;padding:13px;border-radius:12px;font-weight:900;margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;padding:10px 0 14px;border-top:1px solid #eee;z-index:30}
.bottom button{flex:1;border:0;background:none;font-weight:700;color:#888;font-size:14px;cursor:pointer}
.bottom button.active{color:#0B6B3A}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:30px}
.modal-box input,.modal-box textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:8px 0;font-size:15px}
.chat-msg{background:#F2F5F2;padding:10px 12px;border-radius:12px;margin:8px 0;font-size:14px;line-height:1.5}
</style>

<body>

  <button onclick="showPage('favoris',this)">Favoris</button>

function afficher(){
  let q = document.getElementById('rech').value.toLowerCase();

    return `<div class="card">

function showPage(p,btn){
