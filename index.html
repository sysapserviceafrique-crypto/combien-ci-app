<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMBIEN CI — Les prix fixes partout en Côte d'Ivoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Variables de thème par défaut : Vert Ivoire */
        :root {
            --green-primary: #146936;
            --green-dark: #0e4f28;
            --green-soft: #E5F3EA;
            --orange-accent: #F38218;
            --beige-soft: #FCEEE2;
            --beige-text: #C86D14;
            --bg-page: #F6F7F6;
            --bg-desktop: #EAECEB;
            --surface-card: #FFFFFF;
            --surface-muted: #F2F5F3;
            --text-dark: #1A241E;
            --text-muted: #647068;
            --border-light: #E4E8E5;
            --danger: #D93829;
            --danger-soft: #FDECEB;
        }

        /* Thème 2 : Sable Doux */
        [data-theme="sand"] {
            --green-primary: #166534;
            --green-dark: #114c27;
            --green-soft: #E6F2EA;
            --orange-accent: #EA580C;
            --beige-soft: #FDE8D7;
            --beige-text: #B45309;
            --bg-page: #FAF6F0;
            --bg-desktop: #EFE9DF;
            --surface-card: #FFFDF9;
            --surface-muted: #F4EFE6;
            --text-dark: #221E18;
            --text-muted: #6E655B;
            --border-light: #E8E0D5;
        }

        /* Thème 3 : Sombre Pro */
        [data-theme="dark"] {
            --green-primary: #1E8E4A;
            --green-dark: #156936;
            --green-soft: #153322;
            --orange-accent: #F59E0B;
            --beige-soft: #382512;
            --beige-text: #FBBF24;
            --bg-page: #0F1512;
            --bg-desktop: #090D0B;
            --surface-card: #17201B;
            --surface-muted: #1E2923;
            --text-dark: #F1F5F2;
            --text-muted: #9AA8A0;
            --border-light: #28362E;
            --danger-soft: #3A1917;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-desktop);
            color: var(--text-dark);
            margin: 0;
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: var(--bg-page);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .themed-card {
            background-color: var(--surface-card);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .themed-muted {
            background-color: var(--surface-muted);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .themed-surface {
            background-color: var(--surface-card);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.22s ease-out;
        }
    </style>
</head>

            <p class="text-[13.5px] text-white/95 font-normal mb-4">

            <!-- Barre de recherche blanche arrondie -->

    </div>
