<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMBIEN CI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#146936">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
:root{
  --g:#146936;--gt:#146936;--gs:#E5F3EA;--o:#F38218;--bs:#FCEEE2;--bt:#B35A0C;
  --bg:#F6F7F6;--card:#fff;--tx:#1A241E;--mu:#5D6A62;--bd:#E4E8E5;--dan:#D93829;--dans:#FDECEB;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --gt:#6FD39A;--gs:#1B3326;--bs:#3A2A18;--bt:#F5A55A;--bg:#101713;--card:#18211C;--tx:#EAF1EC;--mu:#9DAAA2;--bd:#27332C;--dans:#3A1B18;
  }
}
:root[data-theme="dark"]{
  --gt:#6FD39A;--gs:#1B3326;--bs:#3A2A18;--bt:#F5A55A;--bg:#101713;--card:#18211C;--tx:#EAF1EC;--mu:#9DAAA2;--bd:#27332C;--dans:#3A1B18;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4;
  display:flex;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--g);color:#fff;padding:18px 18px 20px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:42px;height:42px;border-radius:11px;background:var(--o);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
h1{font-size:20px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.vip-pill,.icon-pill{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap
}
.vip-pill.active{background:var(--o);color:#111;border-color:var(--o)}
.sub{font-size:13px;opacity:.95;margin-bottom:14px}
.search-bar{display:flex;gap:8px;align-items:center}
.search-input-wrap{position:relative;flex:1;min-width:0}
.search-input-wrap input{
  width:100%;border:0;border-radius:999px;padding:12px 16px;
  font:inherit;font-size:14px;background:#fff;color:#1A241E;outline:none
}
.search-input-wrap input:focus-visible{box-shadow:0 0 0 3px var(--o)}
.scan-cta{
  border:0;border-radius:999px;padding:12px 14px;background:var(--o);color:#111;
  font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0
}
main{flex:1;padding:14px 14px 96px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pill{
  border:1px solid var(--bd);background:var(--card);color:var(--tx);
  font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;
  white-space:nowrap;cursor:pointer
}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
.head h2{font-size:14px;font-weight:700;color:var(--mu)}
.count{font-size:12px;font-weight:700;color:var(--mu);background:var(--bd);padding:2px 9px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer
}
.card-l{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{
  width:56px;height:56px;border-radius:12px;background:var(--gs);color:var(--gt);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
  border:1px solid var(--bd)
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.detail-img{
  width:100%;height:170px;border-radius:14px;object-fit:cover;display:block;
  margin-bottom:12px;border:1px solid var(--bd);background:var(--gs)
}
.nm{font-size:14.5px;font-weight:700}
.mt{font-size:12px;color:var(--mu);margin-top:2px}
.card-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pr{font-size:14.5px;font-weight:800;color:var(--gt);white-space:nowrap}
.vip-tag{
  display:inline-block;background:var(--bs);color:var(--bt);
  font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-top:3px
}
.fav{background:none;border:0;font-size:18px;cursor:pointer;color:var(--mu);padding:4px}
.fav.on{color:var(--o)}
.box,.empty{
  background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px
}
.empty{text-align:center;color:var(--mu)}
.box h3{font-size:16px;margin-bottom:6px}
.box p{font-size:13.5px;color:var(--mu);margin-bottom:12px}
.meta-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 0;border-top:1px solid var(--bd);font-size:13.5px
}
.meta-row:first-of-type{border-top:0}
.meta-row span{color:var(--mu)}
.meta-row b{color:var(--tx);text-align:right}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;
  border-radius:12px;padding:12px 14px;font:inherit;font-weight:700;font-size:14px;
  background:var(--g);color:#fff;text-decoration:none;cursor:pointer;margin-top:8px
}
.btn.sec{background:var(--bd);color:var(--tx)}
.btn.red{background:var(--dan);color:#fff}
.btn.wave{background:#0099FF;color:#fff}
.btn.vip{background:var(--o);color:#111}
.field{
  width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);
  border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;margin-bottom:10px
}
.wave-box{background:var(--gs);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.wave-title{font-size:18px;font-weight:800;color:var(--gt);margin:4px 0 6px}
.ok{color:var(--gt);font-size:12.5px;font-weight:700;margin-top:8px}
nav{
  position:fixed;bottom:0;width:100%;max-width:480px;background:var(--card);
  border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,1fr);
  padding:8px 2px calc(10px + env(safe-area-inset-bottom,0px));z-index:20
}
nav button{
  background:none;border:0;font:inherit;font-size:12px;font-weight:600;
  color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 2px;cursor:pointer
}
nav button.on{color:var(--gt);font-weight:800}
.back{position:fixed;inset:0;background:rgba(10,18,13,.65);display:none;align-items:flex-end;justify-content:center;z-index:30}
.back.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="brand-l">
        <div class="logo">CI</div>
        <h1>COMBIEN CI</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="vip-pill" id="headerVipBtn" onclick="openSheet('vip')">VIP 500F</button>
        <button type="button" class="icon-pill" onclick="setTab('settings')">Paramètres</button>
      </div>
    </div>
    <div class="sub">10+ repères de prix visibles · Abonnement VIP 500 FCFA / 2 mois via Wave</div>
    <div class="search-bar">
      <div class="search-input-wrap">
        <input id="searchInput" type="search" placeholder="Rechercher un produit, zone ou code...">
      </div>
      <button type="button" class="scan-cta" onclick="openSheet('scan')">SCANNER</button>
    </div>
  </header>

  <main id="mainContent"></main>

  <nav>
    <button type="button" id="tab-home" class="on" onclick="setTab('home')">Accueil</button>
    <button type="button" id="tab-favs" onclick="setTab('favs')">Favoris</button>
    <button type="button" id="tab-settings" onclick="setTab('settings')">Paramètres</button>
  </nav>
</div>

<div class="back" id="sheetBack" onclick="closeSheet(event)">
  <div class="sheet" id="sheetBox" onclick="event.stopPropagation()"></div>
</div>

<script>
const VIP_PRICE = 500;
const VIP_MONTHS = 2;

const STORAGE_ITEMS = "combien_ci_items_v8";
const STORAGE_FAVS = "combien_ci_favs_v8";
const STORAGE_VIP = "combien_ci_vip_v8";
const STORAGE_THEME = "combien_ci_theme_v8";
const STORAGE_CREATOR = "combien_ci_creator_v8";

function makeSvgPhoto(label, bg1, bg2) {
  const safe = String(label || "CI").slice(0, 12);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${bg1}"/>
        <stop offset="100%" stop-color="${bg2}"/>
      </linearGradient>
    </defs>
    <rect width="320" height="220" rx="20" fill="url(#g)"/>
    <circle cx="265" cy="48" r="36" fill="rgba(255,255,255,0.16)"/>
    <text x="24" y="185" fill="#ffffff" font-family="Arial,sans-serif" font-size="28" font-weight="800">${safe}</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

const DEFAULT_ITEMS = [
  { id: 1, name: "Riz parfum (5 kg)", cat: "Alimentation", zone: "Abidjan", price: 4500, code: "1001", vipOnly: false, img: makeSvgPhoto("RIZ 5KG", "#146936", "#229954") },
  { id: 2, name: "Huile raffinée (1 L)", cat: "Alimentation", zone: "Abidjan", price: 1200, code: "1002", vipOnly: false, img: makeSvgPhoto("HUILE 1L", "#D68910", "#F39C12") },
  { id: 3, name: "Attiéké + poisson braisé", cat: "Alimentation", zone: "Yopougon", price: 1500, code: "1003", vipOnly: false, img: makeSvgPhoto("ATTIEKE", "#1E8449", "#2ECC71") },
  { id: 4, name: "Pain baguette standard", cat: "Alimentation", zone: "Cocody", price: 150, code: "1004", vipOnly: false, img: makeSvgPhoto("PAIN", "#B9770E", "#E67E22") },
  { id: 5, name: "Poulet de chair entier", cat: "Alimentation", zone: "Abobo", price: 2800, code: "1005", vipOnly: false, img: makeSvgPhoto("POULET", "#146936", "#27AE60") },
  { id: 6, name: "Course Yopougon -> Plateau", cat: "Transport", zone: "Abidjan", price: 2500, code: "2001", vipOnly: false, img: makeSvgPhoto("TAXI", "#1F618D", "#2980B9") },
  { id: 7, name: "Trajet Gbaka / Woro-woro", cat: "Transport", zone: "Cocody", price: 500, code: "2002", vipOnly: false, img: makeSvgPhoto("GBAKA", "#2874A6", "#5DADE2") },
  { id: 8, name: "Coupe simple coiffure", cat: "Services", zone: "Bouaké", price: 1000, code: "3001", vipOnly: false, img: makeSvgPhoto("COIFFURE", "#7D3C98", "#A569BD") },
  { id: 9, name: "Recharge gaz 12 kg", cat: "Maison", zone: "Yamoussoukro", price: 6965, code: "4001", vipOnly: false, img: makeSvgPhoto("GAZ 12KG", "#B9770E", "#F38218") },
  { id: 10, name: "Sac ciment CPA 42,5 (50 kg)", cat: "Construction", zone: "Abidjan", price: 4600, code: "5001", vipOnly: false, img: makeSvgPhoto("CIMENT", "#566573", "#808B96") },
  { id: 11, name: "Pack VIP : Riz 25 kg gros", cat: "Alimentation", zone: "Adjamé", price: 18500, code: "9001", vipOnly: true, img: makeSvgPhoto("VIP RIZ 25", "#B35A0C", "#F38218") },
  { id: 12, name: "Pack VIP : Fer à béton 12 mm", cat: "Construction", zone: "Abidjan", price: 4900, code: "9002", vipOnly: true, img: makeSvgPhoto("VIP FER 12", "#146936", "#F38218") }
];

const DEFAULT_CREATOR = {
  appName: "COMBIEN CI",
  version: "v2.1",
  license: "Licence COMBIEN CI — Usage personnel & repères locaux",
  creatorName: "sysapserviceafrique-crypto",
  city: "Côte d'Ivoire",
  adminUnlocked: false
};

const state = {
  tab: "home",
  cat: "Tout",
  query: "",
  items: loadJson(STORAGE_ITEMS, DEFAULT_ITEMS),
  favs: loadJson(STORAGE_FAVS, []),
  vipUntil: Number(loadJson(STORAGE_VIP, 0)) || 0,
  theme: loadJson(STORAGE_THEME, "auto"),
  creator: Object.assign({}, DEFAULT_CREATOR, loadJson(STORAGE_CREATOR, {}))
};

let html5QrCode = null;

function loadJson(key, fallback) {
  try {
    const val = JSON.parse(localStorage.getItem(key));
    return val ?? fallback;
  } catch (e) {
    return fallback;
  }
}

function saveAll() {
  try {
    localStorage.setItem(STORAGE_ITEMS, JSON.stringify(state.items));
    localStorage.setItem(STORAGE_FAVS, JSON.stringify(state.favs));
    localStorage.setItem(STORAGE_VIP, JSON.stringify(state.vipUntil));
    localStorage.setItem(STORAGE_THEME, JSON.stringify(state.theme));
    localStorage.setItem(STORAGE_CREATOR, JSON.stringify(state.creator));
  } catch (e) {}
}

function isVipActive() {
  return Date.now() < state.vipUntil;
}

function syncVipBadge() {
  const btn = document.getElementById("headerVipBtn");
  if (!btn) return;
  if (isVipActive()) {
    btn.textContent = "VIP ACTIF";
    btn.classList.add("active");
  } else {
    btn.textContent = "VIP 500F";
    btn.classList.remove("active");
  }
}

function activateVipTwoMonths() {
  const twoMonthsMs = VIP_MONTHS * 30 * 24 * 60 * 60 * 1000;
  state.vipUntil = Date.now() + twoMonthsMs;
  saveAll();
  syncVipBadge();
  render();
}

function applyTheme(mode) {
  state.theme = mode;
  saveAll();
  const root = document.documentElement;
  if (mode === "dark") root.setAttribute("data-theme", "dark");
  else if (mode === "light") root.setAttribute("data-theme", "light");
  else root.removeAttribute("data-theme");
  if (state.tab === "settings") render();
}

function formatFcfa(n) {
  return Number(n || 0).toLocaleString("fr-FR") + " FCFA";
}

function setTab(tab) {
  state.tab = tab;
  ["home", "favs", "settings"].forEach(t => {
    const el = document.getElementById("tab-" + t);
    if (el) el.classList.toggle("on", t === tab);
  });
  render();
}

function setCat(cat) {
  state.cat = cat;
  render();
}

function toggleFav(id, ev) {
  if (ev) ev.stopPropagation();
  const idx = state.favs.indexOf(id);
  if (idx >= 0) state.favs.splice(idx, 1);
  else state.favs.push(id);
  saveAll();
  render();
}

function creatorAddItem(ev) {
  ev.preventDefault();
  const name = document.getElementById("newName").value.trim();
  const cat = document.getElementById("newCat").value;
  const zone = document.getElementById("newZone").value.trim() || "Abidjan";
  const price = parseInt(document.getElementById("newPrice").value, 10);
  const code = document.getElementById("newCode").value.trim();
  const imgInput = document.getElementById("newImg").value.trim();
  const vipOnly = document.getElementById("newVipOnly").checked;
  if (!name || !price || price <= 0) return;

  const img = imgInput || makeSvgPhoto(name, vipOnly ? "#B35A0C" : "#146936", "#F38218");
  state.items.unshift({ id: Date.now(), name, cat, zone, price, code, vipOnly, img });
  saveAll();
  render();
}

function creatorDeleteItem(id) {
  state.items = state.items.filter(item => item.id !== id);
  state.favs = state.favs.filter(favId => favId !== id);
  saveAll();
  render();
}

function creatorSaveInfo(ev) {
  ev.preventDefault();
  state.creator.creatorName = document.getElementById("creatorNameInput").value.trim() || DEFAULT_CREATOR.creatorName;
  state.creator.city = document.getElementById("creatorCityInput").value.trim() || DEFAULT_CREATOR.city;
  state.creator.license = document.getElementById("creatorLicenseInput").value.trim() || DEFAULT_CREATOR.license;
  saveAll();
  render();
}

function resetCatalog() {
  state.items = DEFAULT_ITEMS.slice();
  state.favs = [];
  saveAll();
  render();
}

function openDetail(item) {
  if (item.vipOnly && !isVipActive()) {
    openSheet("vip");
    return;
  }
  openSheet("detail", item);
}

function openSheet(type, payload) {
  stopScanner();
  const back = document.getElementById("sheetBack");
  const box = document.getElementById("sheetBox");

  if (type === "detail" && payload) {
    const imgSrc = payload.img || makeSvgPhoto(payload.name, "#146936", "#229954");
    box.innerHTML = `
      <img class="detail-img" src="${imgSrc}" alt="${payload.name}">
      <h3>${payload.name}</h3>
      <p>Fiche de repère de prix</p>
      <div class="meta-row"><span>Prix</span><b>${formatFcfa(payload.price)}</b></div>
      <div class="meta-row"><span>Catégorie</span><b>${payload.cat}</b></div>
      <div class="meta-row"><span>Zone</span><b>${payload.zone}</b></div>
      ${payload.code ? `<div class="meta-row"><span>Code</span><b>${payload.code}</b></div>` : ""}
      <button type="button" class="btn sec" onclick="closeSheet()">Fermer</button>
    `;
  } else if (type === "vip") {
    const active = isVipActive();
    const expDate = active ? new Date(state.vipUntil).toLocaleDateString("fr-FR") : "";
    box.innerHTML = `
      <h3>Abonnement VIP — ${VIP_PRICE} FCFA / ${VIP_MONTHS} mois</h3>
      <p>${active ? "Ton accès VIP est actif jusqu'au " + expDate + "." : "Débloque tous les prix VIP et les nouveaux produits ajoutés pendant 2 mois via Wave."}</p>
      <div class="wave-box">
        <div style="font-size:12px;color:var(--mu);">Offre VIP (${VIP_PRICE} FCFA · ${VIP_MONTHS} mois)</div>
        <div class="wave-title">COMBIEN CI VIP</div>
        <a class="btn wave" href="https://wave.com" target="_blank" rel="noopener">Payer ${VIP_PRICE} FCFA sur Wave</a>
        <button type="button" class="btn vip" onclick="activateVipTwoMonths(); openSheet('vip');">Activer VIP 2 mois (${VIP_PRICE}F)</button>
        <div id="vipActionMsg"></div>
      </div>
      <button type="button" class="btn sec" onclick="closeSheet()">Fermer</button>
    `;
  } else if (type === "scan") {
    box.innerHTML = `
      <h3>Scanner un produit</h3>
      <p>Pointe la caméra vers un code ou saisis un code produit.</p>
      <div id="qrReader" style="width:100%;min-height:180px;margin:10px 0;"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="manualCodeInput" class="field" style="margin-bottom:0;" type="text" placeholder="Code (ex: 1001)">
        <button type="button" class="btn" style="width:auto;margin-top:0;padding:0 16px;" onclick="searchByCode()">OK</button>
      </div>
      <button type="button" class="btn sec" onclick="closeSheet()">Fermer</button>
    `;
    startScanner();
  }

  back.classList.add("open");
}

function closeSheet(ev) {
  if (ev && ev.target && ev.target.id !== "sheetBack") return;
  stopScanner();
  document.getElementById("sheetBack").classList.remove("open");
}

function searchByCode() {
  const input = document.getElementById("manualCodeInput");
  if (!input) return;
  state.query = input.value.trim();
  const searchEl = document.getElementById("searchInput");
  if (searchEl) searchEl.value = state.query;
  closeSheet();
  setTab("home");
}

function startScanner() {
  if (!window.Html5Qrcode || !document.getElementById("qrReader")) return;
  try {
    html5QrCode = new Html5Qrcode("qrReader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 140 } },
      (decodedText) => {
        state.query = decodedText;
        const searchEl = document.getElementById("searchInput");
        if (searchEl) searchEl.value = decodedText;
        closeSheet();
        setTab("home");
      },
      () => {}
    ).catch(() => {});
  } catch (e) {}
}

function stopScanner() {
  if (html5QrCode) {
    try {
      html5QrCode.stop().catch(() => {});
      html5QrCode.clear();
    } catch (e) {}
    html5QrCode = null;
  }
}

function renderCard(item) {
  const isFav = state.favs.includes(item.id);
  const locked = item.vipOnly && !isVipActive();
  const imgSrc = item.img || makeSvgPhoto(item.name, "#146936", "#229954");
  const safeJson = encodeURIComponent(JSON.stringify(item));
  return `
    <div class="card" onclick="openDetail(JSON.parse(decodeURIComponent('${safeJson}')))">
      <div class="card-l">
        <div class="thumb">
          <img src="${imgSrc}" alt="${item.name}">
        </div>
        <div>
          <div class="nm">${item.name}</div>
          <div class="mt">${item.cat} · ${item.zone}</div>
          ${item.vipOnly ? `<span class="vip-tag">${locked ? "VIP 500F / 2 MOIS" : "CONTENU VIP"}</span>` : ""}
        </div>
      </div>
      <div class="card-r">
        <div class="pr">${locked ? "VIP" : formatFcfa(item.price)}</div>
        <button type="button" class="fav ${isFav ? "on" : ""}" onclick="toggleFav(${item.id}, event)">${isFav ? "★" : "☆"}</button>
      </div>
    </div>
  `;
}

function render() {
  syncVipBadge();
  const main = document.getElementById("mainContent");
  const q = state.query.trim().toLowerCase();

  if (state.tab === "settings") {
    main.innerHTML = `
      <div class="box">
        <h3>Paramètres</h3>
        <p>Personnalise l'apparence, l'abonnement VIP et les options de l'application.</p>
        <div class="meta-row"><span>Abonnement VIP</span><b>${isVipActive() ? "Actif (2 mois)" : "Non actif (500 FCFA / 2 mois)"}</b></div>
        <div class="meta-row"><span>Produits enregistrés</span><b>${state.items.length}</b></div>
        <div class="row" style="margin-top:10px;">
          <button type="button" class="pill ${state.theme === "auto" ? "on" : ""}" onclick="applyTheme('auto')">Auto</button>
          <button type="button" class="pill ${state.theme === "light" ? "on" : ""}" onclick="applyTheme('light')">Clair</button>
          <button type="button" class="pill ${state.theme === "dark" ? "on" : ""}" onclick="applyTheme('dark')">Sombre</button>
        </div>
        <button type="button" class="btn vip" onclick="openSheet('vip')">Gérer l'abonnement VIP Wave (500F)</button>
        <button type="button" class="btn red" onclick="resetCatalog()">Réinitialiser les produits et favoris</button>
      </div>

      <div class="box">
        <h3>Gestion Créateur</h3>
        <p>Espace réservé au créateur pour publier ou supprimer des produits et modifier les infos de l'application.</p>
        <button type="button" class="btn sec" onclick="state.creator.adminUnlocked = !state.creator.adminUnlocked; saveAll(); render();">
          ${state.creator.adminUnlocked ? "Fermer l'espace gestion Créateur" : "Ouvrir l'espace gestion Créateur"}
        </button>
      </div>

      ${state.creator.adminUnlocked ? `
        <form class="box" onsubmit="creatorSaveInfo(event)">
          <h3>Modifier les infos & licence</h3>
          <input id="creatorNameInput" class="field" type="text" value="${state.creator.creatorName.replace(/"/g, "&quot;")}" placeholder="Nom du créateur">
          <input id="creatorCityInput" class="field" type="text" value="${state.creator.city.replace(/"/g, "&quot;")}" placeholder="Zone / Pays">
          <input id="creatorLicenseInput" class="field" type="text" value="${state.creator.license.replace(/"/g, "&quot;")}" placeholder="Licence">
          <button type="submit" class="btn sec">Enregistrer les infos</button>
        </form>

        <form class="box" onsubmit="creatorAddItem(event)">
          <h3>Ajouter un produit (Créateur uniquement)</h3>
          <input id="newName" class="field" type="text" placeholder="Nom du produit ou service" required>
          <select id="newCat" class="field">
            <option value="Alimentation">Alimentation</option>
            <option value="Transport">Transport</option>
            <option value="Services">Services</option>
            <option value="Maison">Maison</option>
            <option value="Construction">Construction</option>
          </select>
          <input id="newZone" class="field" type="text" placeholder="Zone (ex : Abidjan, Yopougon)">
          <input id="newPrice" class="field" type="number" min="50" step="50" placeholder="Prix en FCFA" required>
          <input id="newImg" class="field" type="url" placeholder="Lien photo (optionnel)">
          <input id="newCode" class="field" type="text" placeholder="Code produit (optionnel)">
          <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px;">
            <input id="newVipOnly" type="checkbox"> Réserver ce produit aux abonnés VIP (500F / 2 mois)
          </label>
          <button type="submit" class="btn">Publier le produit</button>
        </form>

        <div class="box">
          <h3>Produits enregistrés (${state.items.length})</h3>
          ${state.items.map(it => `
            <div class="meta-row">
              <div><b>${it.name}</b><div class="mt">${formatFcfa(it.price)} · ${it.zone}</div></div>
              <button type="button" class="btn red" style="width:auto;margin-top:0;padding:8px 12px;font-size:12px;" onclick="creatorDeleteItem(${it.id})">Supprimer</button>
            </div>
          `).join("")}
        </div>
      ` : ""}

      <div class="box">
        <h3>Informations sur l'application & Créateur</h3>
        <p>Détails officiels de l'application, de la licence et de la personne qui a créé COMBIEN CI.</p>
        <div class="meta-row"><span>Application</span><b>${state.creator.appName}</b></div>
        <div class="meta-row"><span>Version</span><b>${state.creator.version}</b></div>
        <div class="meta-row"><span>Créateur de l'appli</span><b>${state.creator.creatorName}</b></div>
        <div class="meta-row"><span>Localisation</span><b>${state.creator.city}</b></div>
        <div class="meta-row"><span>Licence</span><b>${state.creator.license}</b></div>
      </div>
    `;
    return;
  }

  const cats = ["Tout", "Alimentation", "Transport", "Services", "Maison", "Construction"];
  const filtered = state.items.filter(item => {
    const matchCat = state.cat === "Tout" || item.cat === state.cat;
    const matchQuery = !q ||
      item.name.toLowerCase().includes(q) ||
      item.zone.toLowerCase().includes(q) ||
      item.cat.toLowerCase().includes(q) ||
      String(item.code || "").toLowerCase().includes(q);
    const matchFav = state.tab !== "favs" || state.favs.includes(item.id);
    return matchCat && matchQuery && matchFav;
  });

  main.innerHTML = `
    <div class="row">
      ${cats.map(c => `<button type="button" class="pill ${state.cat === c ? "on" : ""}" onclick="setCat('${c}')">${c}</button>`).join("")}
    </div>
    <div class="head">
      <h2>${state.tab === "favs" ? "Mes favoris" : "Produits & prix"}</h2>
      <span class="count">${filtered.length}</span>
    </div>
    <div class="list">
      ${filtered.length ? filtered.map(renderCard).join("") : `
        <div class="empty">
          <b>Aucun produit trouvé</b>
          Essaie un autre mot-clé ou une autre catégorie.
        </div>
      `}
    </div>
  `;
}

applyTheme(state.theme);

document.getElementById("searchInput").addEventListener("input", function (e) {
  state.query = e.target.value;
  render();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function () {});
}

render();
</script>
</body>
</html>
