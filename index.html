        :root {

            --surface-muted: #F1F4F2;
            --text-dark: #1A241E;
            --text-muted: #5F6C63;
            --border-light: #E2E7E4;
            --danger: #D93829;
            --danger-soft: #FDECEB;
        }

            --green-primary: #156634;
            --green-dark: #0f4c26;

            --surface-muted: #F4EFE6;
            --text-dark: #221E18;
            --text-muted: #6C6358;
            --border-light: #E7DFD3;
        }

        [data-theme="dark"] {
            --green-primary: #1E8E4A;
            --green-dark: #156835;
            --green-soft: #153221;
            --orange-accent: #F59E0B;
            --beige-soft: #382512;

            --border-light: #27352D;

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-desktop);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: var(--bg-page);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .themed-card {
            background-color: var(--surface-card);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .themed-muted {
            background-color: var(--surface-muted);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .themed-surface {
            background-color: var(--surface-card);
            border-color: var(--border-light);
            color: var(--text-dark);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
