<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COMBIEN CI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#146936">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --g: #146936;
      --gt: #146936;
      --gs: #E5F3EA;
      --o: #F38218;
      --bs: #FCEEE2;
      --bt: #B35A0C;
      --bg: #F6F7F6;
      --card: #FFFFFF;
      --tx: #1A241E;
      --mu: #5D6A62;
      --bd: #E4E8E5;
      --dan: #D93829;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --gt: #6FD39A;
        --gs: #1B3326;
        --bs: #3A2A18;
        --bt: #F5A55A;
        --bg: #101713;
        --card: #18211C;
        --tx: #EAF1EC;
        --mu: #9DAAA2;
        --bd: #27332C;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.4;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      padding-bottom: 84px;
    }

    header {
      background: var(--g);
      color: #fff;
      padding: 18px 18px 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand-l {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--o);
      color: #111;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    h1 {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .sub {
      font-size: 13.5px;
      opacity: 0.95;
      margin-bottom: 14px;
    }

    .search input {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font: inherit;
      font-size: 14px;
      background: #fff;
      color: #1A241E;
      outline: none;
    }

    main {
      flex: 1;
      padding: 14px 14px 20px;
    }

    .row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .row::-webkit-scrollbar {
      display: none;
    }

    .pill {
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.on {
      background: var(--tx);
      color: var(--bg);
      border-color: var(--tx);
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 10px;
    }

    .head h2 {
      font-size: 14px;
      font-weight: 700;
      color: var(--mu);
    }

    .count {
      font-size: 12px;
      font-weight: 700;
      color: var(--mu);
      background: var(--bd);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 15px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .card-l {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .ini {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--gs);
      color: var(--gt);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }

    .nm {
      font-size: 15px;
      font-weight: 700;
    }

    .mt {
      font-size: 12.5px;
      color: var(--mu);
      margin-top: 2px;
    }

    .card-r {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .pr {
      font-size: 15px;
      font-weight: 800;
      color: var(--gt);
      white-space: nowrap;
    }

    .fav {
      background: none;
      border: 0;
      font-size: 18px;
      cursor: pointer;
      color: var(--mu);
      padding: 4px;
    }

    .fav.on {
      color: var(--o);
    }

    .box {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .box h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .box p {
      font-size: 13.5px;
      color: var(--mu);
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      background: var(--g);
      color: #fff;
      cursor: pointer;
    }

    .btn.sec {
      background: var(--bd);
      color: var(--tx);
      margin-top: 8px;
    }

    .field {
      width: 100%;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      border-radius: 12px;
      padding: 11px 13px;
      font: inherit;
      font-size: 14px;
      margin-bottom: 10px;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-top: 1px solid var(--bd);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 4px;
    }

    nav button {
      background: none;
      border: 0;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--mu);
      padding: 6px 4px;
      cursor: pointer;
    }

    nav button.on {
      color: var(--gt);
      font-weight: 800;
    }

    #error-banner {
      display: none;
      margin: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #FDECEB;
      color: var(--dan);
      font-size: 12.5px;
      white-space: pre-wrap;
      border: 1px solid var(--dan);
    }
  </style>
</head>
<body>
  <div id="error-banner"></div>

  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-l">
          <div class="logo">CI</div>
          <h1>COMBIEN CI</h1>
        </div>
      </div>
      <div class="sub">Repères de prix et services en Côte d'Ivoire</div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Rechercher un produit, service ou zone...">
      </div>
    </header>

    <main id="mainContent"></main>

    <nav>
      <button id="tab-home" class="on" onclick="setTab('home')">Accueil</button>
      <button id="tab-favs" onclick="setTab('favs')">Favoris</button>
      <button id="tab-add" onclick="setTab('add')">Ajouter</button>
    </nav>
  </div>

  <script>

      const banner = document.getElementById("error-banner");
      if (banner) {
        banner.style.display = "block";
        banner.textContent = "Erreur : " + event.message + " (ligne " + event.lineno + ")";
      }

      { id: 5, name: "Recharge bouteille gaz 12 kg", cat: "Maison", zone: "Yamoussoukro", price: 6965 }
