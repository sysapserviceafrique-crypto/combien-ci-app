<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMBIEN CI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#146936">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#146936;--gt:#146936;--gs:#E5F3EA;--o:#F38218;--bs:#FCEEE2;--bt:#B35A0C;--bg:#F6F7F6;--card:#fff;--tx:#1A241E;--mu:#5D6A62;--bd:#E4E8E5;--dan:#D93829;--dans:#FDECEB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gt:#6FD39A;--gs:#1B3326;--bs:#3A2A18;--bt:#F5A55A;--bg:#101713;--card:#18211C;--tx:#EAF1EC;--mu:#9DAAA2;--bd:#27332C;--dans:#3A1B18}}
:root[data-theme="dark"]{--gt:#6FD39A;--gs:#1B3326;--bs:#3A2A18;--bt:#F5A55A;--bg:#101713;--card:#18211C;--tx:#EAF1EC;--mu:#9DAAA2;--bd:#27332C;--dans:#3A1B18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4;display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:10}
.app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--g);color:#fff;padding:18px 18px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--o);color:#111;font-weight:800;display:flex;align-items:center;justify-content:center}
h1{font-size:22px;font-weight:800;letter-spacing:.4px}
.sub{font-size:14px;opacity:.95;margin-bottom:16px}
.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#7A857E}
.search input{width:100%;border:0;border-radius:999px;padding:14px 16px 14px 44px;font:inherit;font-size:14px;background:#fff;color:#1A241E;outline:none}
.search input:focus-visible{box-shadow:0 0 0 3px var(--o)}
main{flex:1;padding:16px 16px 100px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip{border:0;background:transparent;color:var(--mu);font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gs);color:var(--gt)}
.head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.head h2{font-size:14.5px;font-weight:600;color:var(--mu)}
.count{font-size:12px;font-weight:700;color:var(--mu);background:var(--bd);padding:3px 9px;border-radius:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.ini{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;background:var(--gs);color:var(--gt)}
.ini.b{background:var(--bs);color:var(--bt)}
.info{flex:1;min-width:0}
.nm{font-size:15px;font-weight:700}
.mt{font-size:12.5px;color:var(--mu);margin-top:2px}
.rt{text-align:right;flex-shrink:0}
.pr{font-size:15.5px;font-weight:800;white-space:nowrap}
.bd{display:inline-block;margin-top:4px;background:var(--gs);color:var(--gt);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.fav{background:none;border:0;color:var(--mu);cursor:pointer;padding:6px;margin:-6px -6px -6px 0;display:inline-flex}
.fav.on{color:var(--o)}
.empty,.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:12px}
.empty{text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.box h3{font-size:16px;margin-bottom:6px}
.box p{font-size:14px;color:var(--mu);margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:15px;background:var(--g);color:#fff;text-decoration:none;cursor:pointer}
.btn.red{background:var(--dan)}
nav{position:fixed;bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer}
nav button.on{color:var(--gt);font-weight:700}
.back{position:fixed;inset:0;background:rgba(10,18,13,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.back.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sh{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.x{background:var(--bd);border:0;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--tx);cursor:pointer;flex-shrink:0}
.big{background:var(--gs);border-radius:16px;padding:16px;margin-bottom:12px}
.big small{color:var(--gt);font-weight:600;font-size:12.5px}
.big div{font-size:26px;font-weight:800;color:var(--gt)}
.calc{border:1.5px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.step{display:flex;align-items:center;gap:12px;background:var(--bg);padding:6px 10px;border-radius:12px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;font-weight:700;cursor:pointer}
.step b{min-width:22px;text-align:center}
.tot{text-align:right}.tot small{display:block;font-size:11.5px;color:var(--mu)}.tot b{font-size:18px}
.note{font-size:12px;color:var(--mu);margin-top:10px}
button:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--o);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo">CI</div><h1>COMBIEN CI</h1></div>
<p class="sub">Les prix fixes, partout en Côte d’Ivoire. Fini la vie chère.</p>
<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="q" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit" autocomplete="off"></label>
</header>
<main id="main"></main>
<nav aria-label="Navigation principale">
<button data-tab="home" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Accueil</button>
<button data-tab="favs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>Favoris</button>
<button data-tab="report"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>Signaler</button>
</nav>
</div>
<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st">
<div class="sh"><div style="display:flex;gap:12px;align-items:center"><div class="ini" id="si"></div><div><h3 id="st" style="font-size:17px"></h3><div class="mt" id="sm"></div></div></div><button class="x" id="sx" aria-label="Fermer">×</button></div>
<div class="big"><small>Prix plafonné officiel (Abidjan et 30 km)</small><div id="sp"></div></div>
<div class="calc"><div class="step"><button id="mi" aria-label="Moins">−</button><b id="sq">1</b><button id="pl" aria-label="Plus">+</button></div><div class="tot"><small>Total à payer</small><b id="stt"></b></div></div>
<a class="btn red" href="tel:1343">Prix non respecté ? Appeler le 1343</a>
<p class="note">Hors Abidjan et 30 km, un supplément de transport s’applique selon la localité.</p>
</div></div>
<script>
// Prix plafonnés officiels : Bulletin d’informations du Gouvernement n°34, juillet 2026
const P=[
["Baguette de pain","232 g",200,"Pain"],["Baguette de pain","174 g",150,"Pain"],
["Lait en poudre","sachet de 15 g",100,"Lait"],["Lait en poudre Nido","boîte de 400 g",4000,"Lait"],["Lait en poudre Laity","boîte de 400 g",2850,"Lait"],["Lait en poudre Bonnet Rouge","boîte de 400 g",4000,"Lait"],
["Tomate concentrée","sachet de 70 g",105,"Tomate"],["Tomate concentrée","sachet de 370 g",475,"Tomate"],["Tomate concentrée","boîte de 370 g",500,"Tomate"],
["Riz, 5 % de brisures","sac de 22,5 kg",12788,"Riz"],["Riz, 25 % de brisures","sac de 22,5 kg",12315,"Riz"],["Riz, 100 % de brisures","sac de 22,5 kg",11750,"Riz"],
["Huile de table","0,90 L",1200,"Huile"],["Huile de table","1,50 L",1775,"Huile"],["Huile de table","3 L",3775,"Huile"],["Huile de table","25 L",26500,"Huile"],
["Spaghetti Maman","200 g",225,"Pâtes"],["Spaghetti Maman","500 g",550,"Pâtes"],
["Sucre blanc granulé","1 kg",875,"Sucre"],["Sucre roux granulé","1 kg",825,"Sucre"],["Sucre blanc granulé","435 g",450,"Sucre"],["Sucre roux granulé","435 g",450,"Sucre"],["Sucre blanc granulé","230 g",250,"Sucre"],["Sucre roux granulé","230 g",250,"Sucre"],["Sucre blanc en morceaux","1 kg",1000,"Sucre"]
].map((p,i)=>({id:i,n:p[0],u:p[1],p:p[2],g:p[3]}));
const G=["Tous","Pain","Lait","Tomate","Riz","Huile","Pâtes","Sucre"];
const CATS=["Alimentation","Machines","Matériaux"];
const S={tab:"home",cat:"Alimentation",g:"Tous",q:"",favs:[],cur:null,qty:1};
try{S.favs=JSON.parse(localStorage.getItem("ci_favs")||"[]")}catch(e){}
const $=s=>document.querySelector(s);
const fp=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" FCFA";
const ini=p=>p.g.slice(0,2).toUpperCase();
const tone=p=>G.indexOf(p.g)%2?"b":"";
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function save(){try{localStorage.setItem("ci_favs",JSON.stringify(S.favs))}catch(e){}}
function card(p){const f=S.favs.includes(p.id);
return `<div class="card" role="button" tabindex="0" data-id="${p.id}"><div class="ini ${tone(p)}">${ini(p)}</div><div class="info"><div class="nm">${p.n}</div><div class="mt">${p.u}</div></div><div class="rt"><div class="pr">${fp(p.p)}</div><span class="bd">Prix fixe</span> <button class="fav ${f?"on":""}" data-fav="${p.id}" aria-label="${f?"Retirer des favoris":"Ajouter aux favoris"}"><svg width="17" height="17" viewBox="0 0 24 24" fill="${f?"currentColor":"none"}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg></button></div></div>`}
function render(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
const m=$("#main");
if(S.tab==="report"){m.innerHTML=`<div class="box"><h3>Un commerçant dépasse le prix plafonné ?</h3><p>Appelez le numéro vert gratuit du ministère du Commerce. Donnez le nom du produit, le prix demandé et le lieu.</p><a class="btn red" href="tel:1343">Appeler le 1343</a></div><div class="box"><h3>À savoir</h3><p>Les prix affichés sont les prix plafonnés officiels, valables à Abidjan et dans un rayon de 30 km. Source : Bulletin d’informations du Gouvernement n°34, juillet 2026.</p></div>`;return}
const q=norm(S.q.trim());let L;
if(S.tab==="favs"){L=P.filter(p=>S.favs.includes(p.id));
m.innerHTML=`<div class="head"><h2>Mes produits suivis</h2><span class="count">${L.length}</span></div>`+(L.length?`<div class="list">${L.map(card).join("")}</div>`:`<div class="empty"><b>Aucun favori</b>Appuyez sur le cœur d’un produit pour le retrouver ici.</div>`);return}
const pills=`<div class="row">${CATS.map(c=>`<button class="pill ${c===S.cat?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>`;
if(!q&&S.cat!=="Alimentation"){m.innerHTML=pills+`<div class="empty"><b>Pas encore de prix officiel</b>Les prix fixes pour « ${S.cat} » seront ajoutés dès qu’ils seront publiés par les autorités.</div>`;return}
L=P.filter(p=>q?norm(p.n+" "+p.g+" "+p.u).includes(q):(S.g==="Tous"||p.g===S.g));
const chips=q?"":`<div class="row">${G.map(g=>`<button class="chip ${g===S.g?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>`;
m.innerHTML=(q?"":pills+chips)+`<div class="head"><h2>${q?"Résultats":"Prix plafonnés officiels, Abidjan et 30 km"}</h2><span class="count">${L.length}</span></div>`+(L.length?`<div class="list">${L.map(card).join("")}</div>`:`<div class="empty"><b>Aucun produit trouvé</b>Essayez : riz, huile, sucre, pain, lait.</div>`)}
function open(id){const p=P[id];S.cur=p;S.qty=1;
$("#si").textContent=ini(p);$("#si").className="ini "+tone(p);$("#st").textContent=p.n;$("#sm").textContent=p.u;$("#sp").textContent=fp(p.p);calc();$("#back").classList.add("open");$("#sx").focus()}
function calc(){$("#sq").textContent=S.qty;$("#stt").textContent=fp(S.cur.p*S.qty)}
function close(){$("#back").classList.remove("open")}
$("#main").addEventListener("click",e=>{
const f=e.target.closest("[data-fav]");if(f){e.stopPropagation();const i=+f.dataset.fav;S.favs=S.favs.includes(i)?S.favs.filter(x=>x!==i):[...S.favs,i];save();render();return}
const c=e.target.closest("[data-cat]");if(c){S.cat=c.dataset.cat;render();return}
const g=e.target.closest("[data-g]");if(g){S.g=g.dataset.g;render();return}
const k=e.target.closest(".card");if(k)open(+k.dataset.id)});
$("#main").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();open(+e.target.dataset.id)}});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;window.scrollTo(0,0);render()});
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(S.tab!=="home")S.tab="home";render()});
$("#mi").onclick=()=>{if(S.qty>1){S.qty--;calc()}};$("#pl").onclick=()=>{S.qty++;calc()};
$("#sx").onclick=close;$("#back").addEventListener("click",e=>{if(e.target.id==="back")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
